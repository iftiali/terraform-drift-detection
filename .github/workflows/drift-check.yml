name: "Terraform Drift Check"

on:
  # schedule:
  #   - cron: "*/5 * * * *"   # every 5 minutes (testing)
  workflow_dispatch:

jobs:
  drift_check:
    name: "Scheduled Terraform Drift Detection"
    runs-on: ubuntu-latest
    environment: terraform-plan

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: ./s3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (drift check)
        id: drift
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -input=false -out drift-plan | tee drift.log
          TERRAFORM_EXIT=${PIPESTATUS[0]}
          set -e 
          echo "Terraform exited with code: $TERRAFORM_EXIT"
          echo "exit_code=$TERRAFORM_EXIT" >> $GITHUB_OUTPUT
          terraform show -no-color drift-plan > tfdriftfile.txt || true
          cat drift.log

      - name: Upload drift log
        uses: actions/upload-artifact@v4
        with:
          name: terraform-drift-log
          path: ./s3/drift.log

      - name: Send Drift Detected Email
        if: ${{ steps.drift.outputs.exit_code == '2' }}
        run: |
          echo "Infrastructure drift detected."
          python3 scripts/send_plan_email.py
        env:
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ vars.RECIPIENT_EMAIL }}

      - name: Log Drift to CloudWatch
        if: ${{ steps.drift.outputs.exit_code == '2' }}
        run: |
          echo "Infrastructure drift detected."
          python3 scripts/log_to_cloudwatch.py drift.log /github/terraform/drift

      - name: No Drift Detected
        if: ${{ steps.drift.outputs.exit_code == '0' }}
        run: echo "No infrastructure drift detected."

      - name: Handle Terraform Errors
        if: steps.drift.outputs.exit_code != '0' && steps.drift.outputs.exit_code != '2'
        run: |
          echo "Terraform plan failed. Check drift.log for details." 
          exit 1